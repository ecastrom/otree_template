{{ block title }}{{ endblock }}

{{ block styles }}
<link href="{{ static 'global/custom.css' }}" rel="stylesheet">
{{ endblock }}

{{ block content }}
<div style="text-align: right;"><span class="beca-timer" id="timer">0:30</span></div>

<!-- PATTERN: timed real-effort task. Every confirmed answer goes to the
     server (liveSend) and is graded there; the visible timer is deadline
     based (survives a locked phone); oTree's timeout_seconds is the
     second line. Numeric keypad via inputmode, Confirmar button + Enter. -->
<div class="suma-stage" id="stage">
    <p>¿Cuánto es</p>
    <div class="suma-display" id="s-display"></div>
    <input type="text" id="s-input" class="suma-input" inputmode="numeric"
           pattern="[0-9]*" autocomplete="off" autofocus>
    <div style="margin-top: 0.8rem;">
        <button type="button" class="btn btn-primary btn-lg" id="s-confirm">Confirmar</button>
    </div>
    <p class="text-muted mt-2">Escribe el resultado y presiona <strong>Confirmar</strong> (o Enter).</p>
    <p class="text-muted" id="s-count" style="font-size: 0.9rem;"></p>
</div>

<div id="ended" style="display:none; text-align:center; margin-top: 1.5rem;">
    <p>¡Tiempo terminado!</p>
    {{ next_button }}
</div>

<script>
(function() {
  const duration = js_vars.duration_s;
  const deadline = Date.now() + duration * 1000;
  let a = 0, b = 0, ended = false;
  const timer = document.getElementById('timer');
  const display = document.getElementById('s-display');
  const input = document.getElementById('s-input');
  const confirmBtn = document.getElementById('s-confirm');
  const stage = document.getElementById('stage');
  const endedBox = document.getElementById('ended');
  const count = document.getElementById('s-count');
  function gen() {
    a = 10 + Math.floor(Math.random() * 90);
    b = 10 + Math.floor(Math.random() * 90);
    display.textContent = a + ' + ' + b;
    input.value = '';
    input.focus();
  }
  function finish() {
    if (ended) return;
    ended = true;
    stage.style.display = 'none';
    endedBox.style.display = 'block';
  }
  function confirm() {
    if (ended) return;
    const raw = (input.value || '').replace(/[^0-9]/g, '');
    if (raw === '') { input.focus(); return; }
    liveSend({a: a, b: b, val: parseInt(raw, 10)});
    gen();
  }
  confirmBtn.addEventListener('click', confirm);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); confirm(); }
  });
  window.liveRecv = function(data) {
    if (data && typeof data.attempts === 'number') count.textContent = 'Respuestas confirmadas: ' + data.attempts;
  };
  function tick() {
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    timer.textContent = Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + (left % 60);
    if (left <= 0) { clearInterval(interval); finish(); }
  }
  const interval = setInterval(tick, 500);
  document.addEventListener('visibilitychange', tick);
  gen();
})();
</script>
{{ endblock }}
